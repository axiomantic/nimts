[project]
name = "nimts-cabi-tools"
version = "0.3.0"
description = "HeaderKit v2 TypeScript WebAssembly (.d.ts) C-ABI declaration generator for NimTS"
requires-python = ">=3.11,<3.14"
dependencies = [
    "headerkit[treesitter]>=0.50.0",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -p no:testmon -p no:cacheprovider"

[tool.tripwire.guard]
subprocess = "off"

[tool.tripwire.firewall]
allow = ["subprocess:nim"]
