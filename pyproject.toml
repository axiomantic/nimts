[project]
name = "nimts-cabi-tools"
version = "0.2.1"
description = "HeaderKit v2 TypeScript WebAssembly (.d.ts) C-ABI declaration generator for NimTS"
requires-python = ">=3.11,<3.14"
dependencies = [
    "headerkit[treesitter] @ git+https://github.com/axiomantic/headerkit.git@feat/headerkit-roundtable-v2",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
headerkit = { path = "/Users/eek/Development/headerkit", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -p no:testmon -p no:cacheprovider"

[tool.tripwire.firewall]
allow = ["subprocess:nim"]
