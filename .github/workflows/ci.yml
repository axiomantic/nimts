name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --verbose --redact

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        node-version: [ 20.x, 22.x ]
        nim-version: [ '2.2.0' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Set up Nim ${{ matrix.nim-version }}
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install LLVM & WebAssembly Toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          # Ensure wasm-ld is on PATH
          if ! command -v wasm-ld &>/dev/null; then
            WASM_LD_CANDIDATE=$(compgen -c wasm-ld- | head -1 || echo "")
            if [[ -n "${WASM_LD_CANDIDATE}" ]]; then
              sudo ln -sf "$(command -v "${WASM_LD_CANDIDATE}")" /usr/local/bin/wasm-ld
            fi
          fi
          # Install wasi-sysroot
          WASI_VERSION=22
          WASI_VERSION_FULL=${WASI_VERSION}.0
          wget -q https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/wasi-sysroot-${WASI_VERSION_FULL}.tar.gz
          sudo tar -xzf wasi-sysroot-${WASI_VERSION_FULL}.tar.gz -C /usr/share/
          echo "WASI_SYSROOT=/usr/share/wasi-sysroot" >> $GITHUB_ENV
          echo "CLANG_BIN=$(command -v clang)" >> $GITHUB_ENV
          echo "WASM_LD_BIN=$(command -v wasm-ld)" >> $GITHUB_ENV

      - name: Install LLVM & WebAssembly Toolchain (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install llvm lld || true
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> $GITHUB_PATH
          echo "CLANG_BIN=${LLVM_PREFIX}/bin/clang" >> $GITHUB_ENV
          if [[ -x "${LLVM_PREFIX}/bin/wasm-ld" ]]; then
            echo "WASM_LD_BIN=${LLVM_PREFIX}/bin/wasm-ld" >> $GITHUB_ENV
          else
            echo "WASM_LD_BIN=$(command -v wasm-ld)" >> $GITHUB_ENV
          fi
          WASI_VERSION=22
          WASI_VERSION_FULL=${WASI_VERSION}.0
          curl -sSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/wasi-sysroot-${WASI_VERSION_FULL}.tar.gz" -o wasi-sysroot.tar.gz
          sudo mkdir -p /opt
          sudo tar -xzf wasi-sysroot.tar.gz -C /opt/
          echo "WASI_SYSROOT=/opt/wasi-sysroot" >> $GITHUB_ENV

      - name: Install Node dependencies
        run: npm ci

      - name: Build TypeScript code
        run: npm run build

      - name: Run Nimble package check and unit tests
        run: |
          nimble check
          nimble test

      - name: Run Vitest integration suite
        run: npm test

      - name: Verify npm packaging
        run: npm pack --dry-run
